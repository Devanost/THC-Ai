[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thc-ai"
version = "1.0.0"
description = "Advanced Agentic Terminal AI Assistant"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich",
    "openai",
    "python-dotenv"
]

[project.scripts]
thc-ai = "thc_ai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thc_ai*"]
